<html>
  <head>
    <title>My Chat App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
      .tiny5-duo {
        font-family: "Tiny5 Duo", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings:
          "wdth" 100,
          "BLED" 0,
          "JITT" 0,
          "ROND" 0;
      }

      .chat_list {
        border: 1px solid black;
        flex:1;
        overflow-wrap: break-word;
        overflow: auto;
        border-radius: 15px;
        padding: 10px;
        box-shadow: 1px 1px 6px black;
      }

      .chat_input{
        /* border: 1px solid blue; */
      }

      body {
        height: 96vh;
        display: flex;
        flex-direction: column;
        gap: 5px;
        background-color: hsl(182.7, 100%, 91.2%);

        font-family: "DM Mono", monospace;
        font-weight: 400;
        font-style: normal;
      }
      #chat_container {
        flex: 1;
        display:flex;
        flex-direction: column;
        gap: 15px;
        min-height: 0;
        display: flex;
      }
    </style>
 </head>
  <body>
    <h1 class="tiny5-duo">Welcome to My Chat App</h1>

    <div id="chat_container">
      <div class="chat_list"></div>
      <div class="chat_input">
        <input id="message_input" type="text">
        <button id="message_button" >Send</button>
      </div>
    </div>

  </body>
  <script>
    const username = "Pip";
    const messages = []
   

    const sendNewMessage = (newMessage) => {
      const newEl = document.createElement("div");
      newEl.innerText = username + ": " + newMessage;
      const chatList = document.querySelector(".chat_list");
      chatList.appendChild(newEl);
      postNewMessage(username,newMessage)
    }

    const getAndClearMessage = () => {
      const messageInputEl = document.querySelector("#message_input")
      const newMessage = messageInputEl.value;
      messageInputEl.value = "";
      return newMessage; 
    }

    const handleNewMessageClick = () => {
      const newMessage = getAndClearMessage();
      sendNewMessage(newMessage);
    }

    const newMessageButton = document.querySelector("#message_button");
    newMessageButton.addEventListener("click",handleNewMessageClick);
    const messageInputEl2 = document.querySelector("#message_input")
    messageInputEl2.addEventListener("keypress",(event) => {
      if(event.key === "Enter") {
        handleNewMessageClick()
        event.preventDefault()
      }
    })

    const postNewMessage = async (username, newMessage) => await fetch("/message", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: newMessage, username }),
    });

    const getMessages = async () => {
        const response = await fetch("/message");
        const result = await response.json();
        return result.messages;
    }

     const populateMessages = async () => {
      messages.splice()
      messages.push(...(await getMessages()))
      messages.forEach(m => {
        const newEl = document.createElement("div");
        newEl.innerText = m.username + ": " + m.message;
        const chatList = document.querySelector(".chat_list");
        chatList.appendChild(newEl);
      })
    }

    populateMessages()
  </script>
</html>
