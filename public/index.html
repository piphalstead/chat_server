<html>
  <head>
    <title>My Chat App</title>

<style>
  .chat_list {
    border: 1px solid red;
    flex:1;
    overflow-wrap: break-word;
    overflow: auto;
  }
  .chat_input{
    border: 1px solid blue;
  }
  body {
    height: 96vh;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #chat_container {
    flex: 1;
    display:flex;
    flex-direction: column;
    gap: 5px;
    min-height: 0;
  }
</style>
 </head>
  <body>
    <h1>Welcome to My Chat App</h1>

    <div id="chat_container">
      <div class="chat_list"></div>
      <div class="chat_input">
        <input id="message_input" type="text">
        <button id="message_button" >Send</button>
      </div>
    </div>

  </body>
  <script>
    const username = "Pip";

    const sendNewMessage = (newMessage) => {
      const newEl = document.createElement("div");
      newEl.innerText = username + ": " + newMessage;
      const chatList = document.querySelector(".chat_list");
      chatList.appendChild(newEl);
      postNewMessage(username,newMessage)
    }

    const getAndClearMessage = () => {
      const messageInputEl = document.querySelector("#message_input")
      const newMessage = messageInputEl.value;
      messageInputEl.value = "";
      return newMessage; 
    }

    const handleNewMessageClick = () => {
      const newMessage = getAndClearMessage();
      sendNewMessage(newMessage);
    }

    const newMessageButton = document.querySelector("#message_button");
    newMessageButton.addEventListener("click",handleNewMessageClick);
    const messageInputEl2 = document.querySelector("#message_input")
    messageInputEl2.addEventListener("keypress",(event) => {
      if(event.key === "Enter") {
        handleNewMessageClick()
        event.preventDefault()
      }
    })

    const postNewMessage = async (username, newMessage) => await fetch("/message", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: newMessage, username }),
    });

    const getMessages = async () => {
        const response = await fetch("/message");
        const result = await response.json();
        return result;
    }
  </script>
</html>
